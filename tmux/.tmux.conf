set -g default-terminal "tmux-256color"

set-option -gas terminal-overrides "*:Tc" # true color support
set-option -gas terminal-overrides "*:RGB" # true color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set -sg escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
setw -g aggressive-resize on
set -g status-interval 1

set -g prefix C-a
unbind C-b
bind C-a send-prefix
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'rose-pine/tmux'
# set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor "rose"  # Optional: defaults to lagoon_dark
# set -g @continuum-restore 'on'
# set -g @rose_pine-variant 'main'
#
set -g @tmux-dotbar-bg '#1F1F1F'
set -g @tmux-dotbar-fg '#AEAFAD'
set -g @tmux-dotbar-fg-current '#D4D4D4'

setw -g status-keys vi
setw -g mode-keys vi
setw -g monitor-activity on

# Stop apps (e.g. Claude Code) from overwriting window names via their own
# OSC title escapes — names are set deliberately below instead.
set -g allow-rename off

# Claude Code multi-agent status: color a window's pill by the @claude_state
# user option (busy/waiting/idle), set via claude-tmux-status hooks. Falls
# back to the oasis theme's normal color when @claude_state is unset. Plain
# `-g` (not oasis's `-ogq`) so a reload always wins, not just a fresh server
# boot — oasis's own `-ogq` default below is a no-op once this is set.
set -g @oasis_module_window_inactive "\
#[fg=#{?#{==:#{@claude_state},waiting},#{@thm_red},#{?#{==:#{@claude_state},busy},#{@thm_orange},#{@thm_surface}}},bg=#{@thm_mantle}]\
#{?client_prefix,\
#{#[bg=#{?#{==:#{@claude_state},waiting},#{@thm_red},#{?#{==:#{@claude_state},busy},#{@thm_orange},#{@thm_surface}}},fg=#{?#{||:#{==:#{@claude_state},waiting},#{==:#{@claude_state},busy}},#{@thm_core},#{@thm_secondary}}#{?#{==:#{@claude_state},waiting},#,bold,}] #I#{?#{!=:#{window_name},Window}, #W,}#{?#{==:#{@claude_state},waiting}, !,}},\
#{#[bg=#{?#{==:#{@claude_state},waiting},#{@thm_red},#{?#{==:#{@claude_state},busy},#{@thm_orange},#{@thm_surface}}},fg=#{?#{||:#{==:#{@claude_state},waiting},#{==:#{@claude_state},busy}},#{@thm_core},#{@thm_strong_primary}}#{?#{==:#{@claude_state},waiting},#,bold,}] #I#{?#{!=:#{window_name},Window}, #W,}#{?#{==:#{@claude_state},waiting}, !,}}\
}\
#[fg=#{?#{==:#{@claude_state},waiting},#{@thm_red},#{?#{==:#{@claude_state},busy},#{@thm_orange},#{@thm_surface}}},bg=#{@thm_mantle}]"
set -g @oasis_module_window_active "\
#[fg=#{?#{==:#{@claude_state},waiting},#{@thm_red},#{?#{==:#{@claude_state},busy},#{@thm_orange},#{@thm_secondary}}},bg=#{@thm_mantle}]\
#[bg=#{?#{==:#{@claude_state},waiting},#{@thm_red},#{?#{==:#{@claude_state},busy},#{@thm_orange},#{@thm_secondary}}},fg=#{@thm_core},bold] #I#{?#{!=:#{window_name},Window}, #W,}#{?#{==:#{@claude_state},waiting}, !,} \
#[fg=#{?#{==:#{@claude_state},waiting},#{@thm_red},#{?#{==:#{@claude_state},busy},#{@thm_orange},#{@thm_secondary}}},bg=#{@thm_mantle}]"

bind-key v split-window -h
bind-key s split-window -v

bind -T copy-mode-vi v send-keys -X begin-selection
if-shell 'uname -s | grep -q Darwin' \
    "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'clip.exe'"

bind r source-file ~/.tmux.conf
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Move windows. Focus follows the window it moves. The edge guards suppress
# swap-window's wrap, which otherwise throws the window to the far end of the
# list on one keypress too many.
bind-key -n C-S-Left  if -F '#{?window_start_flag,0,1}' 'swap-window -t :-1 ; select-window -t :-1'
bind-key -n C-S-Right if -F '#{?window_end_flag,0,1}'   'swap-window -t :+1 ; select-window -t :+1'

# Prefix equivalents, repeatable: hold the key to drag a window several slots.
bind-key -r H if -F '#{?window_start_flag,0,1}' 'swap-window -t :-1 ; select-window -t :-1'
bind-key -r L if -F '#{?window_end_flag,0,1}'   'swap-window -t :+1 ; select-window -t :+1'

# Vim style pane selection
bind ^ last-window
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
